<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>AI Revenue Recovery Agent</title>
    <style>
        @font-face {
            font-family: 'system-serif';
            src: local('Georgia');
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: #0B1220;
            overflow: hidden;
        }

        .stage {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* subtle ledger-grid texture in the background */
        .stage::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(212, 175, 109, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(212, 175, 109, 0.04) 1px, transparent 1px);
            background-size: 48px 48px;
            pointer-events: none;
        }

        .eyebrow {
            font-family: 'Consolas', 'SFMono-Regular', Menlo, monospace;
            font-size: 15px;
            letter-spacing: 0.28em;
            color: #D4AF6D;
            text-transform: uppercase;
            margin-bottom: 28px;
            opacity: 0.9;
        }

        h1 {
            font-family: Georgia, 'Times New Roman', serif;
            font-weight: 400;
            font-size: 64px;
            color: #F4F1E8;
            text-align: center;
            line-height: 1.15;
            max-width: 900px;
            letter-spacing: -0.01em;
        }

        h1 .accent {
            color: #D4AF6D;
            font-style: italic;
        }

        .subtitle {
            margin-top: 26px;
            font-family: 'Segoe UI', Arial, sans-serif;
            font-size: 20px;
            color: #9AA5B8;
            text-align: center;
            max-width: 620px;
            line-height: 1.5;
        }

        /* signature element: the pipeline, as a minimal ledger/audit-trail line */
        .pipeline {
            margin-top: 56px;
            display: flex;
            align-items: center;
            gap: 0;
        }

        .node {
            font-family: 'Consolas', monospace;
            font-size: 13px;
            letter-spacing: 0.08em;
            color: #6B7690;
            padding: 8px 16px;
            border: 1px solid #26304A;
            border-radius: 3px;
            background: rgba(212, 175, 109, 0.03);
            white-space: nowrap;
        }

        .node.ml {
            color: #D4AF6D;
            border-color: #4A3E24;
            background: rgba(212, 175, 109, 0.08);
        }

        .connector {
            width: 28px;
            height: 1px;
            background: #26304A;
        }

        .footer {
            position: absolute;
            bottom: 48px;
            left: 0;
            right: 0;
            text-align: center;
            font-family: 'Consolas', monospace;
            font-size: 13px;
            letter-spacing: 0.12em;
            color: #4A5470;
            text-transform: uppercase;
        }
    </style>
</head>

<body>

    <div class="stage">
        <div class="eyebrow">Track 03 &nbsp;·&nbsp; AI Revenue Recovery</div>

        <h1>Diagnose <span class="accent">first.</span><br />Recover <span class="accent">right.</span></h1>

        <div class="subtitle">
            An agent that detects revenue at risk, diagnoses why a payment failed,
            and executes a bounded, auditable recovery workflow.
        </div>

        <div class="pipeline">
            <div class="node">DETECT</div>
            <div class="connector"></div>
            <div class="node ml">DIAGNOSE · ML</div>
            <div class="connector"></div>
            <div class="node">DECIDE</div>
            <div class="connector"></div>
            <div class="node">ACT</div>
            <div class="connector"></div>
            <div class="node">AUDIT</div>
        </div>

        <div class="footer">Razorpay Buildathon &nbsp;·&nbsp; Test-Mode Agent</div>
    </div>

</body>

</html>
